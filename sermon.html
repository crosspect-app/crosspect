<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проповедь · Слово веры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&family=Inter:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0c11; --surface:#12151d; --surface-2:#191d27;
  --line:rgba(251,247,240,.08); --line-2:rgba(251,247,240,.15);
  --text:#fbf7f0; --muted:rgba(251,247,240,.6); --faint:rgba(251,247,240,.36);
  --accent:#e7ae89; --accent-1:#f1cfb3; --accent-2:#c9805e; --on-accent:#1b100a;
  --warn:#ffcf4a; --warn-bg:rgba(255,207,74,.12); --danger:#ff8b7b; --ok:#86e0a0;
  --topbar:rgba(10,12,17,.8); --mark:rgba(231,174,137,.34); --shadow:0 18px 50px rgba(0,0,0,.45);
  --c-scripture:#f1cfb3; --c-scripture2:#dc9f7a; --c-thesis:#b8a8ff; --c-quote:#8ddcc7;
  --c-image:#ff9fc2; --c-video:#ff9472; --c-free:#a3abbd; --c-text:rgba(251,247,240,.28); --c-note:#ffcf4a;
  --r:20px;
  /* Поля слайда в пикселях кадра 1920×1080: панель отступает от края на 44, поля считаются от края панели (по умолчанию 60) */
  --sl-x:104px; --sl-t:104px; --sl-b:104px;
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme:light;
    --bg:#f4efe7; --surface:#fffcf7; --surface-2:#f6f1e9;
    --line:rgba(40,28,18,.09); --line-2:rgba(40,28,18,.17);
    --text:#1e1711; --muted:rgba(30,23,17,.62); --faint:rgba(30,23,17,.4);
    --accent:#b0653d; --accent-1:#e2a47e; --accent-2:#b0653d; --on-accent:#fff;
    --warn:#9a6a00; --warn-bg:rgba(230,170,20,.14); --danger:#c2412f; --ok:#2e9a55;
    --topbar:rgba(244,239,231,.84); --mark:rgba(226,164,126,.42); --shadow:0 18px 50px rgba(60,40,20,.15);
    --c-scripture:#c27a52; --c-scripture2:#a65a34; --c-thesis:#6b56d8; --c-quote:#1f8d73;
    --c-image:#c44579; --c-video:#c9532f; --c-free:#6c7486; --c-text:rgba(30,23,17,.25); --c-note:#b07a00;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:'Unbounded','Inter','Segoe UI',Arial,sans-serif; font-weight:300; font-size:14px;
  line-height:1.6; letter-spacing:-0.01em; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
  background:
    radial-gradient(900px 520px at -5% -10%, rgba(201,128,94,.17), transparent 60%),
    radial-gradient(700px 460px at 105% 0%, rgba(130,140,255,.07), transparent 60%);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:-1; opacity:.28; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.45' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='1 1 1 0 -1.05 1 1 1 0 -1.05 1 1 1 0 -1.05 0 0 0 0 1'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:256px 256px;
}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
.ic{display:inline-flex;width:18px;height:18px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Верхняя панель ---------- */
.topbar{
  position:sticky; top:0; z-index:30; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
  padding:12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
  background:var(--topbar); backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px) saturate(1.2);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-bar{width:5px;height:30px;border-radius:99px;background:linear-gradient(180deg,var(--accent-1),var(--accent-2));flex:none}
.brand-kicker{font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.brand-title{font-size:15px;font-weight:600;letter-spacing:-0.02em;white-space:nowrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 15px;border-radius:99px;font-size:12px;font-weight:500;color:var(--muted);transition:.15s}
.seg button.on{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;position:relative}
.btn{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:transparent;
  border-radius:99px;padding:8px 14px;font-size:12px;font-weight:500;white-space:nowrap;transition:.15s;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{border:0;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));color:var(--on-accent);padding:9px 16px}
.btn.primary:hover{filter:brightness(1.06)}
.icon-btn{
  display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;border:1px solid transparent;
  background:transparent;color:var(--muted);transition:.15s;padding:0;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.icon-btn.danger:hover{color:var(--danger)}
.icon-btn.mark.on{color:var(--ok);background:color-mix(in srgb, var(--ok) 15%, transparent);border-color:color-mix(in srgb, var(--ok) 35%, transparent)}
.menu{
  position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:16px;padding:6px;box-shadow:var(--shadow);display:none;z-index:40;
}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:11px;font-size:12px;font-weight:400}
.menu button:hover{background:var(--surface-2)}
.menu button:disabled{opacity:.35;cursor:default;background:transparent}
.menu-note{padding:4px 12px 6px;font-size:10px;color:var(--faint)}
.menu-sep{height:1px;background:var(--line);margin:4px 6px}

.statusbar{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1200px;margin:14px auto 0;padding:0 16px;
  font-size:10.5px;color:var(--faint);letter-spacing:.02em;
}
.statusbar .warn{color:var(--warn)}
.statusbar .ok{color:var(--muted)}
.banner{
  max-width:1200px;margin:12px auto 0;padding:0 16px;
}
.banner > div{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 16px;border-radius:16px;
  background:var(--warn-bg);border:1px solid rgba(255,207,74,.35);font-size:12px;
}
.banner .grow{flex:1;min-width:200px}

/* ---------- Основная колонка ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 140px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.meta{padding:20px 20px 18px;position:relative;overflow:hidden}
.meta::after{
  content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,128,94,.22),transparent 65%);pointer-events:none;
}
.kicker{font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.title-input{
  width:100%;border:0;background:transparent;outline:none;padding:6px 0 14px;margin:0;
  font-size:24px;font-weight:600;letter-spacing:-0.03em;line-height:1.25;color:var(--text);
}
.title-input::placeholder{color:var(--faint)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1}
.field{display:block;min-width:0}
.lbl{display:block;font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 7px 2px}
.lbl-row{display:flex;justify-content:space-between;align-items:center}
.lbl-row .lbl{margin-bottom:7px}
.input,.rich{
  display:block;width:100%;font-size:14px;font-weight:300;color:var(--text);background:var(--surface-2);
  border:1px solid var(--line);border-radius:13px;padding:11px 13px;outline:none;line-height:1.55;
  transition:border-color .15s, box-shadow .15s;
}
.input::placeholder{color:var(--faint)}
.input:focus,.rich:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(231,174,137,.12)}
input[type=date].input{min-height:46px}
textarea.input{resize:none;overflow:hidden;min-height:46px}
.rich{min-height:46px;white-space:pre-wrap;word-break:break-word}
.rich:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.rich b,.vs-body b{font-weight:600}
.rich i,.vs-body i{font-style:italic}
.rich u,.vs-body u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent)}
mark{background:var(--mark);color:inherit;border-radius:5px;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.up{text-transform:uppercase}   /* «Все прописные» для выделенного текста */

/* ---------- Блоки ---------- */
.blocks{margin-top:4px}
.block{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px 16px 22px;transition:border-color .2s, box-shadow .2s, background-color .2s;
}
.block::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 99px 99px 0;background:var(--tc)}
.block.t-text{background:transparent;border-style:dashed;border-color:var(--line-2)}
.block.t-note{background:color-mix(in srgb, var(--c-note) 7%, var(--surface));border-color:color-mix(in srgb, var(--c-note) 38%, transparent)}
.block.t-note textarea.input{text-transform:uppercase;font-weight:600}
.block.done{background:color-mix(in srgb, var(--ok) 9%, var(--surface));border-color:color-mix(in srgb, var(--ok) 40%, transparent)}
.block.done .bsub{color:var(--ok)}
.block.over{border-color:rgba(255,207,74,.55);box-shadow:0 0 0 3px var(--warn-bg)}
.block.missing{border-color:color-mix(in srgb, var(--danger) 70%, transparent);box-shadow:0 0 0 3px color-mix(in srgb, var(--danger) 14%, transparent)}
/* Название слайда: номер [N] зашит слева, его не стереть */
.namebox{display:flex;align-items:stretch;min-width:0}
.name-pre{display:grid;place-items:center;padding:0 12px;border:1px solid var(--line);border-right:0;border-radius:13px 0 0 13px;
  background:color-mix(in srgb, var(--tc) 14%, var(--surface-2));color:var(--tc);font-weight:600;white-space:nowrap}
.namebox .input{border-radius:0 13px 13px 0;min-width:0}
.namebox.missing .input{border-color:var(--danger)}
.name-err{font-size:10.5px;color:var(--danger);margin:6px 0 0 2px}
.block.flash{animation:flash 1.1s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(231,174,137,.0)}25%{box-shadow:0 0 0 4px rgba(231,174,137,.35)}100%{box-shadow:0 0 0 0 rgba(231,174,137,0)}}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.btag{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;user-select:none}
.bnum{
  display:grid;place-items:center;min-width:40px;height:40px;border-radius:13px;padding:0 8px;
  background:color-mix(in srgb, var(--tc) 14%, transparent);color:var(--tc);font-size:14px;font-weight:600;letter-spacing:-0.02em;
}
.bnum.off{background:transparent;border:1px dashed var(--line-2);color:var(--faint)}
.block.t-note .bnum.off{border-color:color-mix(in srgb, var(--c-note) 50%, transparent);color:var(--c-note)}
.btype{font-size:13px;font-weight:500;letter-spacing:-0.01em;line-height:1.3}
.bsub{font-size:10px;color:var(--faint);letter-spacing:.02em}
.btools{display:flex;gap:2px;flex:none}
.bbody{display:grid;gap:14px}
.block.collapsed{padding-top:10px;padding-bottom:10px}
.block.collapsed::before{top:12px;bottom:12px}
.block.collapsed .bhead{margin-bottom:0}
.block.collapsed .bnum{height:34px;min-width:34px;border-radius:11px;font-size:13px}
.bsum{display:block;margin-top:2px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bsum.empty{color:var(--faint)}
.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.verses{display:grid;gap:8px}
.verse{display:grid;grid-template-columns:56px 1fr 30px;gap:8px;align-items:start}
.vnum{text-align:center;padding:11px 4px;font-weight:600;color:var(--accent)}
.vdel{width:30px;height:46px;border-radius:10px}
.vdel .ic{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:transparent;border-radius:99px;
  padding:7px 13px 7px 10px;font-size:11px;font-weight:500;color:var(--muted);transition:.15s;
}
.chip .ic{width:15px;height:15px}
.chip:hover{color:var(--text);background:var(--surface-2)}
.chip.accent{color:var(--accent);border-color:color-mix(in srgb, var(--accent) 45%, transparent)}
.link{border:0;background:transparent;color:var(--faint);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:0 2px 7px}
.link:hover{color:var(--danger)}
.hint{margin:0;font-size:11px;line-height:1.6;color:var(--faint)}
.hint b{color:var(--muted);font-weight:500}
.half{display:grid;gap:12px}
.half-tag{display:flex;align-items:center;gap:10px;font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--tc)}
.half-tag::after{content:"";flex:1;height:1px;background:var(--line-2)}
.divider{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:10px;letter-spacing:.06em}
/* Части сложного слайда Писания — отдельные карточки */
.block.t-scripture .bbody > .item,.block.t-thesis .bbody > .item{padding:12px 14px 14px;border:1px solid var(--line-2);border-radius:16px;background:color-mix(in srgb, var(--surface-2) 45%, transparent)}
.block.t-scripture .bbody > .divider,.block.t-thesis .bbody > .divider{margin:-6px 0}
.item.k-line{padding-top:8px;padding-bottom:10px}
.line-demo{height:2px;margin:6px 4px 2px;border-radius:2px;background:currentColor;opacity:.45;color:var(--text)}
/* Греческий и иврит — шрифтом Inter (иврит — Noto Sans Hebrew), чтобы не терялись буквы и знаки */
.xl{font-family:'Inter','Noto Sans Hebrew',sans-serif;font-weight:700;letter-spacing:0;text-transform:none}   /* греческий не переводим в заглавные: пропали бы ударения */
.sl .xl{font-family:'Inter','Noto Sans Hebrew',sans-serif;font-weight:700;letter-spacing:0;text-transform:none}   /* то же в слайде и JPEG */
.divider::before,.divider::after{content:"";flex:1;border-top:1px dashed var(--line-2)}
.toggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px;width:max-content;max-width:100%}
.toggle button{border:0;background:transparent;border-radius:99px;padding:8px 15px;font-size:11.5px;font-weight:500;color:var(--muted);transition:.15s}
.toggle button.on{background:var(--tc, var(--accent));color:var(--on-accent)}
.callout{
  display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:14px;font-size:12px;line-height:1.6;
  background:color-mix(in srgb, var(--tc) 9%, transparent);border:1px solid color-mix(in srgb, var(--tc) 25%, transparent);
}
.callout .ic{color:var(--tc);margin-top:1px}
.callout b{font-weight:600}
.switch{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);cursor:pointer;width:max-content;max-width:100%}
.switch input{position:absolute;opacity:0;pointer-events:none}
.sw{position:relative;width:40px;height:24px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-2);flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--faint);transition:.2s}
.switch input:checked + .sw{background:linear-gradient(135deg,var(--accent-1),var(--accent-2));border-color:transparent}
.switch input:checked + .sw::after{left:19px;background:var(--on-accent)}
.switch input:focus-visible + .sw{box-shadow:0 0 0 3px rgba(231,174,137,.25)}
.opt-row{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.count{font-size:10.5px;color:var(--faint);letter-spacing:.02em}
.step{display:inline-flex;align-items:center;gap:2px;margin:0 0 5px;border:1px solid var(--line-2);border-radius:99px;padding:2px}
.step button{display:grid;place-items:center;width:26px;height:24px;border:0;border-radius:99px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;padding:0}
.step button:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.step button:disabled{opacity:.3;cursor:default}
.step span{min-width:48px;text-align:center;font-size:11px;font-weight:500;color:var(--text)}
.count.warn{color:var(--warn);font-weight:400}

.insert{position:relative;display:flex;justify-content:center;align-items:center;height:30px}
.insert button{
  position:relative;z-index:1;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;padding:0;
  border:1px solid var(--line-2);background:var(--bg);color:var(--faint);opacity:.55;transition:.15s;
}
.insert button .ic{width:14px;height:14px}
.insert:hover button,.insert button:focus-visible{opacity:1;color:var(--accent);border-color:var(--accent)}
.add-big{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;padding:18px;border-radius:var(--r);
  border:1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent);background:color-mix(in srgb, var(--accent) 5%, transparent);
  color:var(--accent);font-size:13px;font-weight:500;transition:.15s;
}
.add-big:hover{background:color-mix(in srgb, var(--accent) 10%, transparent)}
.empty{margin-top:18px;padding:22px 22px 8px;border-radius:var(--r);border:1px solid var(--line);background:color-mix(in srgb, var(--surface) 60%, transparent)}
.empty-title{font-size:15px;font-weight:500;letter-spacing:-0.02em;margin-bottom:6px}
.empty ol{margin:0 0 12px;padding-left:20px;color:var(--muted);font-size:12px;line-height:1.8}


/* ---------- Блок со слайдом: форма + предпросмотр ---------- */
.bsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,440px);gap:20px;align-items:start}
.bprev{position:sticky;top:78px;display:grid;gap:8px}
.bprev-cap{display:flex;justify-content:space-between;gap:10px;font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bprev-cap span:last-child{letter-spacing:.02em;text-transform:none;font-weight:400;color:var(--faint);text-align:right}
.block.over .bprev-cap span:last-child{color:var(--warn)}
@media (max-width:1000px){.bsplit{grid-template-columns:1fr}.bprev{position:static}}

/* ---------- Слайд (тема Ember). Размеры заданы в пикселях кадра 1920×1080 ---------- */
.sl{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:6px;--s:.23}
.sl-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:scale(var(--s));
  --u:1;font-family:'Unbounded','Inter',sans-serif;color:#ecdfcf;letter-spacing:-0.035em;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
  box-shadow:0 10px 30px rgba(0,0,0,.25);contain:layout paint}
.sl-frame{position:absolute;inset:calc(var(--u) * 14px);border-radius:calc(var(--u) * 34px);background:#ecdfcf;overflow:hidden}
.sl-frame::after{content:"";position:absolute;inset:0;background-image:var(--noise);background-size:128px 128px;mix-blend-mode:multiply;opacity:.22}
.sl-panel{position:absolute;inset:calc(var(--u) * 44px);border-radius:calc(var(--u) * 8px);overflow:hidden;background:#151612;isolation:isolate}
.sl-glow{position:absolute;inset:-12%;filter:blur(calc(var(--u) * 60px));background:
  radial-gradient(circle at 100% 6%, #c9702a 0, transparent 34%),
  radial-gradient(circle at 102% 40%, #8a8a38 0, transparent 20%),
  radial-gradient(circle at -2% 96%, #ff4a12 0, transparent 30%),
  radial-gradient(circle at 4% 48%, #5a2a16 0, transparent 26%)}
.sl-grain{position:absolute;inset:0;background-image:var(--noise);background-size:128px 128px;mix-blend-mode:overlay;opacity:.6}
.sl-vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 45% 45%, transparent 40%, rgba(0,0,0,.35) 100%)}
.sl-content{position:absolute;left:var(--sl-x);right:var(--sl-x);top:var(--sl-t);text-align:center;display:flex;flex-direction:column;gap:.85em}
.sl-ref{font-weight:700;font-size:1.2083em;line-height:1.1;text-transform:uppercase;letter-spacing:-0.035em;margin:0}
.sl-ref.ph{opacity:.3}
.sl-verse{margin:0;font-weight:400;line-height:1.25;text-wrap:wrap;overflow-wrap:normal}
.sl-verse sup{font-weight:700;font-size:.6em;vertical-align:.95em;line-height:0;letter-spacing:0;margin-right:.18em}
.sl b{font-weight:700}
.sl u{text-decoration-thickness:.07em;text-underline-offset:.16em;text-decoration-color:currentColor}
.sl mark{background:none;color:#ffde59;padding:0;border-radius:0}
.sl .up{text-transform:uppercase}
.sl-text{margin:0;font-weight:400;line-height:1.25}
.sl-text.caps{text-transform:uppercase}
/* ВРЕМЕННО, для теста: «шрифт как в Canva» — тоньше, буквы плотнее, строки ближе. Режим ставится классом на .sl-stage */
.sl-stage.cv-verses .sl-verse,
.sl-stage.cv-all .sl-verse, .sl-stage.cv-all .sl-text, .sl-stage.cv-all .sl-inner{font-weight:325;letter-spacing:-0.04em;line-height:1.05}
.sl-stage.cv-all .sl-mk{height:1.05em}
.sl-stage.cv-all .sl-mk.num{height:auto}
.sl-stage.cv-all .sl-author{font-weight:325}
.sl-hr{height:3px;border-radius:2px;background:#ecdfcf;opacity:.6;margin:.1em 0}   /* линия во всю ширину текста между полями */
.sl-tp{margin:0}
.sl-empty{opacity:.3}
.sl-tr{position:absolute;left:var(--sl-x);right:var(--sl-x);bottom:var(--sl-b);display:none;text-align:center;font-size:43.2px;font-weight:400;line-height:1.1}   /* 90% от размера стихов; точный размер ставится из настроек слайдов */
.sl-tr.on{display:block}
/* Тезис и цитата: текст в своей области, область задана отступами в кадре */
.sl-box{position:absolute;left:var(--sl-x);right:var(--sl-x);top:var(--sl-t);bottom:var(--sl-b);display:flex;flex-direction:column;justify-content:center}
.sl-box-quote{bottom:calc(var(--sl-b) + 150px)}   /* снизу место под автора */
.sl-inner{font-weight:400;line-height:1.25;text-align:center;overflow-wrap:normal}
.sl-inner.caps{text-transform:uppercase}
/* Списки в тезисе: маркер или номер слева, перенос строки встаёт под текст пункта */
.sl-list{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:.38em;width:fit-content;max-width:100%;margin-left:auto;margin-right:auto;padding-left:.9em;text-align:left}   /* отступ пунктов от края текста */
.sl-list:not(:first-child){margin-top:.5em}   /* расстояние от обычной строки до списка */
.sl-list:not(:last-child){margin-bottom:.5em}  /* и от списка до обычной строки */
.sl-part[data-align=left] .sl-list{margin-left:0}
.sl-part[data-align=right] .sl-list{margin-left:auto;margin-right:0}
/* Тезис из нескольких частей: текстовые блоки (у каждого своё выравнивание и размер) и линии */
.sl-inner.parts{display:flex;flex-direction:column;gap:.5em}
.sl-part.caps{text-transform:uppercase}
.sl-li{display:contents}
.sl-mk{display:flex;align-items:center;justify-content:flex-end;min-width:.62em;height:1.25em}   /* высота строки: маркер по центру первой строки */
.sl-mk.num{align-items:baseline;height:auto}
.sl-dot{display:block;width:.22em;height:.22em;border-radius:50%;background:currentColor;transform:translateY(.03em);margin-right:.2em}
.sl i{font-style:italic}
.sl-guide{position:absolute;left:var(--sl-x);right:var(--sl-x);top:var(--sl-t);bottom:var(--sl-b);border:5px dashed #ffde59;border-radius:6px;
  background:repeating-linear-gradient(135deg, rgba(255,222,89,.13) 0 14px, transparent 14px 30px);display:grid;place-items:center;
  color:#ffde59;font-size:46px;font-weight:500;letter-spacing:-.02em}
.sl-author{position:absolute;right:var(--sl-x);bottom:var(--sl-b);max-width:1500px;text-align:right;font-size:52px;line-height:1.05;font-weight:400;text-transform:uppercase;letter-spacing:-0.03em}
.sl-author b{font-weight:700}
.sl-author .src{display:block;margin-top:.45em;font-size:.62em;text-transform:none;opacity:.75}


/* ---------- Выбор места Писания ---------- */
select.input{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:36px;min-height:46px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:16px}
select.input:disabled{opacity:.5;cursor:default}
.grid-3{display:grid;grid-template-columns:1.3fr 1.5fr .7fr;gap:10px}
.item{display:grid;gap:12px}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.item-head .half-tag{flex:1}
.itools{display:flex;gap:2px;flex:none}
.itools .icon-btn{width:28px;height:28px;border-radius:9px}
.itools .icon-btn .ic{width:15px;height:15px}
.itools .icon-btn.on{color:var(--accent);background:var(--surface-2);border-color:var(--line)}
.vpick{display:grid;gap:8px}
.vgrid{display:flex;flex-wrap:wrap;gap:6px}
.vchip{min-width:38px;height:34px;padding:0 6px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);font-size:12px;font-weight:500;color:var(--muted);transition:.12s}
.vchip:hover{color:var(--text);border-color:var(--accent)}
.vchip.on{background:linear-gradient(135deg,var(--accent-1),var(--accent-2));color:var(--on-accent);border-color:transparent}
.vrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vrow .input{flex:1;min-width:140px}
.vlabel{display:grid;place-items:center;height:46px;font-weight:600;color:var(--accent);border-radius:13px;background:color-mix(in srgb, var(--accent) 10%, transparent)}
.loadnote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:10px 13px;border-radius:12px;background:var(--surface-2)}
.loadnote.err{color:var(--danger)}
.trp{position:relative}
.trp-btn{display:flex;align-items:center;gap:8px;text-align:left;min-height:46px;cursor:pointer;padding-right:36px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:16px}
.trp-cur{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trp-note{font-size:10px;color:var(--faint);white-space:nowrap}
.trp-panel{position:absolute;left:0;top:calc(100% + 6px);z-index:45;width:min(400px,calc(100vw - 40px));display:grid;gap:6px;padding:8px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow)}
.trp-list{max-height:340px;overflow:auto;display:grid;gap:2px}
.trp-lang{display:grid;grid-template-columns:auto 1fr 16px;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;font-size:12.5px;font-weight:500}
.trp-lang:hover{background:var(--surface-2)}
.trp-lang .trp-note{text-align:right;overflow:hidden;text-overflow:ellipsis}
.trp-lang.cur .trp-lname{color:var(--accent)}
.trp-chev{display:grid;place-items:center;color:var(--faint)}
.trp-chev svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.trp-lang.open .trp-chev svg{transform:rotate(90deg)}
.trp-it.sub{padding-left:24px}
.trp-sep{height:1px;background:var(--line);margin:4px 6px}
.trp-it{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px;font-size:12px}
.trp-it:hover{background:var(--surface-2)}
.trp-it.on{background:var(--surface-2);color:var(--accent);font-weight:500}
.trp-abbr{display:inline-block;margin-right:7px;padding:1px 6px;border-radius:6px;font-size:9.5px;font-weight:600;letter-spacing:.04em;color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);white-space:nowrap}
.trp-name{min-width:0}
.trp-lang-code{flex:none;font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--faint)}
.cfg-status{display:grid;gap:4px;padding:11px 13px;border-radius:12px;background:var(--surface-2);font-size:11.5px;color:var(--muted)}
.cfg-status .err{color:var(--danger)}
.trp-empty{padding:10px;font-size:11px;line-height:1.5;color:var(--faint)}
.tr-name{font-size:10px;color:var(--faint);letter-spacing:.02em;margin:-4px 0 0 2px}

/* ---------- Выбор типа блока ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(5,7,12,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.sheet{width:100%;max-width:620px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-title{font-size:16px;font-weight:600;letter-spacing:-0.02em}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types-top{grid-template-columns:1.8fr 1fr;margin-bottom:10px}
.type{
  display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;padding:13px;border-radius:16px;
  border:1px solid var(--line);background:var(--surface-2);transition:.15s;
}
.type:hover{border-color:var(--tc);transform:translateY(-1px)}
.type-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb, var(--tc) 15%, transparent);color:var(--tc)}
.type-name{font-size:12.5px;font-weight:500;line-height:1.3}
.type-desc{font-size:10.5px;color:var(--faint);line-height:1.45;margin-top:3px}
.type.t-text{border-style:dashed;background:transparent}
.type.t-note{border-color:color-mix(in srgb, var(--c-note) 50%, transparent);background:color-mix(in srgb, var(--c-note) 10%, var(--surface-2))}
.type.t-note .type-name{font-weight:600}
.set-grid{display:grid;gap:12px;margin:6px 0 16px}
.set-row{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;font-size:12px}
.sheet-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- Панель оформления текста ---------- */
.fmtbar{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(12px);z-index:50;display:flex;gap:4px;padding:5px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:99px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .15s, transform .15s;
}
.fmtbar.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.fbtn{display:grid;place-items:center;min-width:42px;height:38px;padding:0 10px;border-radius:99px;border:0;background:transparent;font-size:14px;color:var(--text)}
.fbtn:hover,.fbtn:active{background:var(--surface-2)}
.fbtn.b{font-weight:700}
.fbtn.i{font-style:italic}
.fbtn.on{background:color-mix(in srgb, var(--accent) 22%, transparent);color:var(--accent)}
.fbtn.u{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.fbtn .ic{width:17px;height:17px}
.fsep{width:1px;background:var(--line-2);margin:6px 2px}
.fbtn.lst,.fsep.lst{display:none}
.fmtbar.lists .fbtn.lst{display:grid}
.fmtbar.lists .fsep.lst{display:block}
.fbtn.lst{font-size:13px;font-weight:600}
.fbtn.up-btn{font-size:11px;font-weight:600;letter-spacing:.02em}
.mock{display:grid;gap:12px;margin:6px 0 14px}
.mock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mock-grid .field .input{text-align:center}
.cfg-note{padding:11px 13px;border-radius:12px;background:var(--surface-2);font-size:11px;line-height:1.6;color:var(--muted)}
.cfg-note.local{background:var(--warn-bg);color:var(--text)}
.tmp-set{border:1px dashed var(--line-2);border-radius:14px;padding:0 14px}
.tmp-set summary{cursor:pointer;padding:12px 0;font-size:12px;color:var(--muted);list-style:none}
.tmp-set summary::-webkit-details-marker{display:none}
.tmp-set summary::before{content:'▸ ';color:var(--faint)}
.tmp-set[open] summary::before{content:'▾ '}
.tmp-set .radios{display:grid;gap:8px;padding:0 0 14px}
.tmp-set label{display:flex;align-items:center;gap:10px;font-size:12px;cursor:pointer}
.tmp-set input{accent-color:var(--accent)}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:70;display:flex;align-items:center;gap:14px;
  padding:11px 12px 11px 18px;border-radius:99px;background:var(--text);color:var(--bg);font-size:12px;font-weight:400;
  opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow);max-width:calc(100vw - 32px)
}
.toast.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.toast button{border:0;background:transparent;color:inherit;font-weight:600;font-size:12px;padding:4px 8px;border-radius:99px;text-decoration:underline;text-underline-offset:3px}
.toast.lift{bottom:84px}

/* ---------- Просмотр для оператора ---------- */
.view{--vs:1;max-width:860px;margin:0 auto}
.vhead{padding:8px 4px 6px}
.vkicker{font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.vtitle{margin:0;font-size:calc(26px * var(--vs));font-weight:600;letter-spacing:-0.035em;line-height:1.2}
.vmeta{margin-top:8px;font-size:12px;color:var(--muted)}
.vref{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 13px 7px 10px;border-radius:99px;border:1px solid var(--line-2);font-size:12px;color:var(--accent)}
.vref .ic{width:15px;height:15px}
.vctrl{position:sticky;top:61px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;margin:10px 0 6px;background:linear-gradient(var(--bg) 70%, transparent)}
.size{display:flex;gap:4px}
.size button{width:38px;height:34px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font-size:11px;font-weight:600}
.vlist{display:grid;gap:12px}
.vslide{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 18px 22px}
.vslide::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 99px 99px 0;background:var(--tc)}
.vs-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.vs-num{font-size:calc(20px * var(--vs));font-weight:700;letter-spacing:-0.04em;color:var(--tc);line-height:1}
.vs-type{flex:1;font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.vs-body{display:grid;gap:12px;font-size:calc(15px * var(--vs));line-height:1.6}
.vs-ref{font-size:calc(13px * var(--vs));font-weight:600;color:var(--accent);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.vs-tr{font-size:calc(10.5px * var(--vs));font-weight:400;color:var(--faint);letter-spacing:.02em}
.vs-verses sup{font-size:.62em;font-weight:600;color:var(--accent);margin-right:3px;vertical-align:.5em}
.vs-note{padding:10px 13px;border-radius:12px;background:var(--surface-2);font-size:calc(13px * var(--vs));color:var(--muted)}
.vs-thesis{font-size:calc(17px * var(--vs));font-weight:500;letter-spacing:-0.02em;line-height:1.45}
.vs-quote{margin:0;font-size:calc(16px * var(--vs));font-weight:400;line-height:1.55}
.vs-author{font-size:calc(12px * var(--vs));color:var(--muted)}
.vs-name{font-size:calc(16px * var(--vs));font-weight:600;letter-spacing:-0.02em;line-height:1.35}
.vs-name.empty-v{font-weight:400}
.vs-name + .vs-media .vs-mtitle{font-weight:400;color:var(--muted)}
.vs-media{display:flex;gap:12px;align-items:flex-start}
.vs-media > .ic{color:var(--tc);width:22px;height:22px;margin-top:2px}
.vs-mtitle{font-weight:500;font-size:calc(13px * var(--vs))}
.vs-mdesc{color:var(--muted);font-size:calc(13px * var(--vs));white-space:pre-wrap;margin-top:4px}
.vs-mdesc a{color:var(--accent);word-break:break-all}
.vs-hr{border-top:1px dashed var(--line-2)}
.empty-v{color:var(--faint);font-style:normal}
.vtx{padding:4px 6px 4px 22px;position:relative}
.vtx::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--line-2)}
.vtx-body{white-space:pre-wrap;color:var(--muted);font-size:calc(13.5px * var(--vs));line-height:1.75}
.vsplash{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:8px;padding:5px 11px 5px 8px;border-radius:99px;
  background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent);font-size:10.5px;font-weight:500;letter-spacing:.04em
}
.vsplash .ic{width:14px;height:14px}
.vnote{padding:12px 16px 14px;border-radius:16px;background:color-mix(in srgb, var(--c-note) 16%, transparent);border:1.5px solid color-mix(in srgb, var(--c-note) 55%, transparent)}
.vnote-tag{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--c-note)}
.vnote-tag .ic{width:15px;height:15px}
.vnote-body{white-space:pre-wrap;text-transform:uppercase;font-weight:700;font-size:calc(14px * var(--vs));line-height:1.5;letter-spacing:.01em;color:var(--text)}

@media (max-width:640px){
  body{font-size:13.5px}
  .topbar{grid-template-columns:auto 1fr auto;gap:8px}
  .brand-kicker,.brand-title{display:none}
  .seg{justify-self:center}
  .seg button{padding:7px 11px;font-size:11px}
  .hide-sm{display:none}
  .btn{padding:8px 11px}
  .topbar{padding-left:max(10px, env(safe-area-inset-left));padding-right:max(10px, env(safe-area-inset-right))}
  .actions{gap:4px}
  .actions .icon-btn{width:30px}   /* чтобы «⋯» не уезжала за край на узком телефоне */
  .input,.rich{font-size:16px}
  .title-input{font-size:20px}
  .meta{padding:18px 16px 16px}
  .meta-grid,.grid-2,.types{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr 1fr}
  .grid-3 > :nth-child(2){grid-column:1 / -1;grid-row:1}
  .block{padding:12px 12px 14px 18px}
  .verse{grid-template-columns:46px 1fr 26px;gap:6px}
  .vdel{width:26px}
  .btools .icon-btn{width:30px;height:32px}
  .btools{gap:0}
  .bhead{flex-wrap:wrap;row-gap:6px}
  .btag{flex:1 1 100%}
  .btools{flex-wrap:wrap;justify-content:flex-end;margin-left:auto;max-width:100%}   /* на телефоне кнопки блока — второй строкой */
  .vctrl{top:59px}
  .set-row{grid-template-columns:1fr 90px}
}
@media print{.topbar,.statusbar,.vctrl,.fmtbar,.vs-copy{display:none!important}}

/* ---------- PDF для оператора: узкие страницы под экран телефона, только то, что нужно на служении ---------- */
#print-op{display:none}
@page op{ size:80mm 170mm; margin:6mm 5mm 7mm }
@media print{
  body.op-print > *:not(#print-op){display:none!important}
  body.op-print{background:#fff!important;min-height:0}
  body.op-print::before,body.op-print::after{display:none!important}
  body.op-print #print-op{display:block;page:op}
}

function h(tag, props){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k.slice(0,2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, c){
  if (c == null || c === false) return;

}

function cleanHTML(node){

    const inner = cleanHTML(n);
    if (tag === 'b' || tag === 'strong') { if (inner) out += '<b>' + inner + '</b>'; return; }

    if (tag === 'i' || tag === 'em') { if (inner) out += '<i>' + inner + '</i>'; return; }

function formatSel(sel){

function parseSel(str, max){

/* ========= Тексты Библии: XML (формат Holyrics / Beblia), грузятся по требованию ========= */
const BIBLE_SRC = ['https://raw.githubusercontent.com/Beblia/Holy-Bible-XML-Format/master/', 'https://cdn.jsdelivr.net/gh/Beblia/Holy-Bible-XML-Format@master/'];

function loadBible(lang){

  const rec = bibles[lang] = { status:'loading' };
  rec.promise = (async () => {
    let txt = null, err = null;
    for (const base of BIBLE_SRC){
      try { const r = await fetch(LANGS[lang].url || base + LANGS[lang].file); if (!r.ok) throw new Error('HTTP ' + r.status); txt = await r.text(); break; }
      catch(e){ err = e; }
    }
    if (!txt) throw err || new Error('load');
    const doc = new DOMParser().parseFromString(txt, 'application/xml');
    const data = {};
    // два формата: Beblia (book/chapter/verse, number) и Zefania (BIBLEBOOK/CHAPTER/VERS, bnumber/cnumber/vnumber)
    const zef = doc.getElementsByTagName('BIBLEBOOK').length > 0;
    const T = zef ? ['BIBLEBOOK', 'CHAPTER', 'VERS', 'bnumber', 'cnumber', 'vnumber'] : ['book', 'chapter', 'verse', 'number', 'number', 'number'];
    const books = doc.getElementsByTagName(T[0]);
    for (let i = 0; i < books.length; i++){
      const bk = books[i], chs = data[+bk.getAttribute(T[3])] = {};

  })();

}
function refreshLang(lang){

/* ========= Модель данных ========= */
function newPart(){ return { kind:'scripture', manual:true, mBook:'', mChapter:'', mVerses:'', ref:'', translation:'', verses:[{ num:'', text:'' }] }; }

        const parts = Array.isArray(b.parts) ? b.parts : [{ ref:b.ref, translation:b.translation, verses:b.verses, autoFirst:b.autoFirst }];
        items = parts.map(p => Object.assign({ kind:'scripture', manual:true }, p));
        if (b.showNote && b.note) items.push({ kind:'text', html:b.note, align:'center' });
      }
      nb.items = items.map(normItem).filter(Boolean);
      if (!nb.items.length) nb.items = [newScripture('ru')];
      ['parts', 'note', 'showNote', 'ref', 'translation', 'verses', 'autoFirst'].forEach(k => delete nb[k]);
    }
    if (b.type === 'thesis' || b.type === 'quote') nb.text = sanitize(nb.text);
    if (b.type === 'thesis'){
      // старые тезисы: один текстовый блок с прежними настройками
      if (!Array.isArray(b.parts) || !b.parts.length)
        nb.parts = [{ kind:'text', html:nb.text || '', align:['left', 'center', 'right'].includes(b.align) ? b.align : 'center', scale:+b.scale || 100, caps:b.caps !== false }];
      nb.parts = nb.parts.map(p => p && p.kind === 'line' ? { kind:'line' }
        : { kind:'text', html:sanitize(p && p.html), align:['left', 'center', 'right'].includes(p && p.align) ? p.align : 'center', scale:+(p && p.scale) || 100, caps:!!(p && p.caps) });
      nb.scale = 100;
      syncThesisText(nb);
    }
    if (NAMED[b.type]) nb.name = cleanName(nb.name);
    if (b.type === 'thesis'){ if (nb.nameAuto == null) nb.nameAuto = !nb.name; if (nb.nameAuto) nb.name = autoName(nb.text); }
    s.blocks.push(nb);
  });
  return s;
}

/* ========= Общие настройки слайдов: поля и названия ========= */
let SLIDES_BASE = JSON.parse(JSON.stringify(SLIDES_DEFAULT));   // из config.json (или встроенные)
const clampN = (v, a, b, d) => { v = Number(v); return isFinite(v) ? Math.min(b, Math.max(a, Math.round(v))) : d; };
function mergeSlides(base, over){
  const r = JSON.parse(JSON.stringify(base));
  if (over && typeof over === 'object'){
    ['margins', 'names', 'font'].forEach(k => { if (over[k] && typeof over[k] === 'object') Object.assign(r[k], over[k]); });
    if (over.sizes && typeof over.sizes === 'object') ['scripture', 'thesis', 'quote'].forEach(k => { if (over.sizes[k] && typeof over.sizes[k] === 'object') Object.assign(r.sizes[k], over.sizes[k]); });
  }
  r.margins.side = clampN(r.margins.side, 0, 400, 60); r.margins.top = clampN(r.margins.top, 0, 400, 60); r.margins.bottom = clampN(r.margins.bottom, 0, 400, 60);
  r.names.required = r.names.required !== false; r.names.maxLength = clampN(r.names.maxLength, 5, 120, 35);
  ['thesis', 'quote'].forEach(k => { const z = r.sizes[k]; z.min = clampN(z.min, 30, 100, 70); z.max = clampN(z.max, 100, 200, 110); });
  r.sizes.scripture = { size:clampN(r.sizes.scripture && r.sizes.scripture.size, 50, 200, 100) };
  r.font = { canva:['verses', 'all'].includes(r.font && r.font.canva) ? r.font.canva : 'off' };
  return r;
}
function slidesLocal(){ try { return JSON.parse(LS.get('swp-slides-local') || 'null'); } catch(e){ return null; } }
function slidesCfg(){ return mergeSlides(SLIDES_BASE, slidesLocal()); }
function marginVars(m){ return { '--sl-x':(PANEL_INSET + m.side) + 'px', '--sl-t':(PANEL_INSET + m.top) + 'px', '--sl-b':(PANEL_INSET + m.bottom) + 'px' }; }
function applySlides(){
  const v = marginVars(slidesCfg().margins);
  Object.keys(v).forEach(k => document.documentElement.style.setProperty(k, v[k]));
}
/* Слайды, у которых обязательное название не заполнено */
function missingNames(){
  if (!slidesCfg().names.required) return [];
  return state.blocks.filter(b => NAMED[b.type] && !cleanName(b.name));
}
let flagMissing = false;   // подсвечивать пустые названия красным — после первой неудачной попытки
function checkNames(){
  const miss = missingNames(); if (!miss.length) return true;
  flagMissing = true;
  const nums = slideNums();
  if (mode !== 'edit'){ mode = 'edit'; LS.set('swp-mode', 'edit'); }
  miss.forEach(b => { b.collapsed = false; });
  renderMain();
  const card = document.querySelector('.block[data-id="' + miss[0].id + '"]');
  if (card){ card.scrollIntoView({ block:'center', behavior:'smooth' }); const f = card.querySelector('.namebox input'); if (f) f.focus({ preventScroll:true }); }
  toast('Напишите названия слайдов: ' + miss.map(b => nums[b.id]).join(', '));
  return false;
}

/* ========= Состояние ========= */
let state, restoreOffer = null, sheetAt = 0, toastTimer = null, draftTimer = null;
let mode = LS.get('swp-mode') === 'view' ? 'view' : 'edit';
let viewOpts = { showText:true, size:1 };
try { Object.assign(viewOpts, JSON.parse(LS.get('swp-view') || '{}')); } catch(e){}

function readEmbedded(){
  const s = document.getElementById('sermon-data');
  try { const d = JSON.parse(s.textContent); return d && Array.isArray(d.blocks) ? d : null; } catch(e){ return null; }
}
function readDraft(id){
  const key = id || LS.get('swp-sermon:last');
  if (!key) return null;
  try { const d = JSON.parse(LS.get('swp-sermon:' + key) || 'null'); return d && Array.isArray(d.blocks) ? d : null; } catch(e){ return null; }
}
function persistDraft(){
  clearTimeout(draftTimer);
  LS.set('swp-sermon:' + state.id, JSON.stringify(state));
  LS.set('swp-sermon:last', state.id);
  updateStatus();
}
function change(){
  state.updatedAt = Date.now();
  clearTimeout(draftTimer);
  draftTimer = setTimeout(persistDraft, 400);
  updateStatus();
}
const isDirty = () => state.updatedAt > (state.savedAt || 0) && (state.blocks.length > 0 || !!state.meta.title);

function slideNums(){
  const m = {}; let n = 0;
  state.blocks.forEach(b => { if (TYPES[b.type].slide) m[b.id] = ++n; });
  m._total = n;
  return m;
}
function partChars(p){ return p.verses.reduce((s, v) => s + plain(v.text).trim().length, 0); }
function limitFor(b){
  const st = state.settings;
  return { scripture:st.minScale, thesis:st.limitThesis, quote:st.limitQuote }[b.type] || 0;
}
function charCount(b){
  switch (b.type){
    case 'scripture':  return b.items.reduce((s, it) => s + (it.kind === 'text' ? plain(it.html).trim().length : it.kind === 'line' ? 0 : partChars(it)), 0);
    case 'thesis':     return plain(b.text).trim().length;
    case 'quote':      return plain(b.text).trim().length + (b.author || '').trim().length;
  }
  return 0;
}
/* Одна строка о содержимом блока — видна, когда блок свёрнут */
function blockSummary(b){
  let t = '';
  switch (b.type){
    case 'scripture':
      t = b.items.map(it => it.kind === 'text' ? plain(it.html) : (it.ref || refString(it))).map(x => String(x || '').trim()).filter(Boolean).join(' · ');
      break;
    case 'thesis': t = plain(b.text); break;
    case 'quote':  t = plain(b.text).trim() ? '«' + plain(b.text).trim() + '»' + (b.author ? ' — ' + b.author : '') : ''; break;
    case 'image':  t = b.desc || (b.mode === 'send' ? 'Файл пришлют отдельно' : ''); break;
    case 'video':  t = b.url || b.desc || (b.mode === 'send' ? 'Видео пришлют отдельно' : ''); break;
    case 'free':   t = b.desc; break;
    case 'text':   t = b.text; break;
    case 'note':   t = b.text; break;
  }
  t = String(t || '').replace(/\s+/g, ' ').trim();
  return t.length > 120 ? t.slice(0, 120) + '…' : t;
}

function renderBlock(b, n){
  const T = TYPES[b.type];

  const card = h('article', { class:'block t-' + b.type + (b.collapsed ? ' collapsed' : '') + (b.done ? ' done' : '') + (miss ? ' missing' : ''), 'data-id':b.id, style:'--tc:var(--c-' + b.type + ')' });
  let sub;
  if (b.collapsed){
    const s = blockSummary(b);
    sub = h('div', { class:'bsum' + (s ? '' : ' empty'), text:s || 'Пока пусто' });
  } else sub = h('div', { class:'bsub', text:T.slide ? 'Слайд ' + n + (b.done ? ' · готов' : '') : (b.type === 'note' ? 'Только для оператора' : 'На экран не выводится') });
  card.append(h('div', { class:'bhead' },
    h('div', { class:'btag', title:b.collapsed ? 'Развернуть' : 'Свернуть', onclick:() => toggleFold(b) },
      T.slide ? h('span', { class:'bnum', text:pad(n) }) : h('span', { class:'bnum off' }, ic(T.icon)),
      h('div', { style:'min-width:0' }, h('div', { class:'btype', text:T.label }), sub)),
    h('div', { class:'btools' },
      T.slide && iconBtn('tag', 'Скопировать название слайда', () => copyText(slideName(b, slideNums()[b.id]), 'Скопировано: ')),
      PREVIEW[b.type] && iconBtn('jpg', 'Скачать слайд в JPEG', () => exportOne(b)),
      T.slide && iconBtn('check', b.done ? 'Снять отметку «готово»' : 'Отметить как готовый', () => toggleDone(b), 'mark' + (b.done ? ' on' : '')),
      iconBtn(b.collapsed ? 'unfold' : 'fold', b.collapsed ? 'Развернуть' : 'Свернуть', () => toggleFold(b)),
      iconBtn('top', 'В самый верх', () => move(b, -Infinity)),
      iconBtn('up', 'Выше', () => move(b, -1)),
      iconBtn('down', 'Ниже', () => move(b, 1)),
      iconBtn('bottom', 'В самый низ', () => move(b, Infinity)),
      iconBtn('dup', 'Дублировать', () => duplicate(b)),

  if (b.collapsed) return card;
  const body = h('div', { class:'bbody' });

function rerender(b, focusKey, offset){

  const nb = renderBlock(b, slideNums()[b.id]);

  if (PREVIEW[b.type] && !b.collapsed){ clearTimeout(previewTimers[b.id]); runPreview(b); }   // раскладываем сразу, без пустого кадра

function updateCounter(b){
  const card = document.querySelector('.block[data-id="' + b.id + '"]'); if (!card) return;
  if (card.querySelector('.sl')){ schedulePreview(b); return; }

/* Свернуть или развернуть блоки, подходящие под условие: fold(b) — свернуть ли этот блок */
function foldWhere(pred, fold, msg){
  if (mode !== 'edit') return;
  state.blocks.forEach(b => { if (pred(b)) b.collapsed = !!fold(b); });

function rich(value, o){
  const el = h('div', { class:'rich ' + (o.cls || ''), contenteditable:'true', 'data-ph':o.ph || '', spellcheck:'true', role:'textbox' });
  if (o.key) el.dataset.key = o.key;
  if (o.lists) el.dataset.lists = '1';
  el.innerHTML = sanitize(value);
  el.addEventListener('input', e => {
    if (o.lists && e.inputType === 'insertText' && e.data === ' ') autoList(el);
    const v = finalize(cleanHTML(el));
    if (!v && el.innerHTML !== '') el.innerHTML = '';
    o.onInput(v);
  });
  el.addEventListener('paste', e => {
    e.preventDefault();
    let t = ((e.clipboardData && e.clipboardData.getData('text/plain')) || '').replace(/\u00ad/g, '');   // мягкие переносы с сайтов вроде azbyka.ru
    t = t.replace(/\r\n?/g, '\n');
    if (o.single) t = t.replace(/\s*\n\s*/g, ' ').replace(/[ \t\u00a0]+/g, ' ');
    if (o.lists){   // по строкам: переносы — это <br>, а «- » в начале строки становится «• »
      t.split('\n').forEach((ln, i) => {
        if (i) document.execCommand('insertLineBreak');
        if (ln) document.execCommand('insertText', false, ln.replace(/^\s*[-*•][ \t]+/, '• ').replace(/^\s*(\d{1,2})[.)][ \t]+/, '$1. '));
      });
    } else document.execCommand('insertText', false, t);
    if (o.onPasted) o.onPasted(el);
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing){
      if (o.onEnter){ e.preventDefault(); o.onEnter(el); }
      else if (o.single) e.preventDefault();
      return;
    }
    if (e.key === 'Backspace' && o.onBackStart && caretAtStart(el)) { if (o.onBackStart(el)) e.preventDefault(); }
  });
  el.addEventListener('beforeinput', e => {
    if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak'){
      if (o.onEnter){ e.preventDefault(); o.onEnter(el); }
      else if (o.single) e.preventDefault();
    }
  });
  return el;
}
function caretAtStart(el){
  const s = getSelection(); if (!s.rangeCount) return false;
  const r = s.getRangeAt(0);
  if (!r.collapsed || !el.contains(r.startContainer)) return false;
  const pre = document.createRange(); pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString().length === 0;
}
function setCaret(el, off){
  const s = getSelection(), r = document.createRange();
  if (off == null || off === 'end'){ r.selectNodeContents(el); r.collapse(false); }
  else {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n, rem = off, placed = false;
    while ((n = w.nextNode())){ if (rem <= n.nodeValue.length){ r.setStart(n, rem); r.collapse(true); placed = true; break; } rem -= n.nodeValue.length; }
    if (!placed){ r.selectNodeContents(el); r.collapse(off === 0); }
  }
  s.removeAllRanges(); s.addRange(r);
}
function focusRich(key, off){
  const el = document.querySelector('[data-key="' + key + '"]'); if (!el) return;
  el.focus({ preventScroll:true }); setCaret(el, off);
  const rect = el.getBoundingClientRect();
  if (rect.top < 80 || rect.bottom > window.innerHeight - 90) el.scrollIntoView({ block:'center', behavior:'smooth' });
}

function partEditor(block, part, pi){

    oninput:e => { part.mVerses = e.target.value; upd(); }, onchange:() => { syncManualVerses(part); change(); rerender(block); } });
  wrap.append(h('div', { class:'grid-3' }, h('div', { class:'field' }, h('span', { class:'lbl', text:'Перевод' }), picker), field('Книга', book), field('Глава', chap)));

    field('Название перевода', input(part, 'translation', 'Например: перевод Десницкого', { autocomplete:'off', oninput:e => { part.translation = e.target.value; change(); updateCounter(block); } }))));
  const vs = h('div', { class:'verses' });
  part.verses.forEach((v, vi) => vs.append(verseRow(block, part, pi, vi)));
  wrap.append(h('div', null, h('span', { class:'lbl', text:'Текст стихов' }), vs));
  return wrap;
}

function verseRow(block, part, pi, vi){
  const v = part.verses[vi];
  if (!part.manual) return autoVerseRow(block, part, pi, vi);
  const num = h('input', { class:'input vnum', value:v.num, placeholder:'№', inputmode:'numeric', 'aria-label':'Номер стиха',
    oninput:e => { v.num = e.target.value.trim(); if (vi === 0) part.autoFirst = false; change(); updateCounter(block); } });
  const only = part.verses.length === 1;
  const txt = rich(v.text, {
    key:block.id + ':' + pi + ':' + vi, single:true, cls:'vtext',
    ph:only ? 'Вставьте текст. Enter перед номером стиха — новая строка' : 'Текст стиха',
    onInput:val => { v.text = val; change(); updateCounter(block); },
    onEnter:el => splitVerse(block, part, pi, vi, el),
    onBackStart:() => { if (vi > 0){ mergeVerse(block, part, pi, vi); return true; } return false; },
    onPasted:el => {
      if (v.num) return;
      const html = finalize(cleanHTML(el));
      const m = /^(\d{1,3})(?:\s|&nbsp;|[.:)])+/.exec(html);
      if (!m) return;
      v.num = m[1]; v.text = html.slice(m[0].length); num.value = v.num;
      if (vi === 0) part.autoFirst = false;
      el.innerHTML = v.text; setCaret(el, 'end'); change(); updateCounter(block);
    }
  });
  const del = only ? h('span') : iconBtn('close', 'Убрать стих', () => { part.verses.splice(vi, 1); change(); rerender(block); }, 'vdel');
  return h('div', { class:'verse' }, num, txt, del);
}

function splitVerse(block, part, pi, vi, el){
  const v = part.verses[vi];
  let head = v.text, tail = '';
  const s = getSelection();
  if (s.rangeCount && el.contains(s.getRangeAt(0).startContainer)){
    const r = s.getRangeAt(0); if (!r.collapsed) r.deleteContents();
    const t = document.createRange(); t.setStart(r.startContainer, r.startOffset); t.setEnd(el, el.childNodes.length);
    const tmp = document.createElement('div'); tmp.appendChild(t.extractContents());
    tail = finalize(cleanHTML(tmp)); head = finalize(cleanHTML(el));
  }
  head = rtrimH(head); tail = ltrimH(tail);
  let num = nextNum(v.num);
  const m = /^(\d{1,3})(?:\s|&nbsp;|[.:)])+/.exec(tail);
  if (m){ num = m[1]; tail = tail.slice(m[0].length); }
  v.text = head;
  part.verses.splice(vi + 1, 0, { num:num, text:tail });
  change();
  rerender(block, block.id + ':' + pi + ':' + (vi + 1), 0);
}
function mergeVerse(block, part, pi, vi){
  const prev = part.verses[vi - 1], cur = part.verses[vi];
  const a = rtrimH(prev.text), b = ltrimH(cur.text), sep = a && b ? ' ' : '';
  const off = plain(a).length + sep.length;
  prev.text = a + sep + b;
  part.verses.splice(vi, 1);
  change();
  rerender(block, block.id + ':' + pi + ':' + (vi - 1), off);
}
function addVerse(block, part, pi){
  const last = part.verses[part.verses.length - 1];
  part.verses.push({ num:nextNum(last.num), text:'' });
  change();
  rerender(block, block.id + ':' + pi + ':' + (part.verses.length - 1), 0);
}

/* Размер текста: цитата — от 100% (= на 10% крупнее имени автора) до 85%, тезис — от 100% до 70%, шаг 1% */
const scaleRange = t => { const z = slidesCfg().sizes; return z[t] || null; };   // диапазон из общих настроек слайдов
const blkScale = b => { const R = scaleRange(b.type); return R ? Math.min(R.max, Math.max(R.min, Math.round(+b.scale || 100))) : 100; };
function scaleStepper(b){
  const R = scaleRange(b.type);
  const val = h('span'), minus = h('button', { type:'button', title:'Мельче на 1%', 'aria-label':'Мельче на 1%' }, '−'),
    plus = h('button', { type:'button', title:'Крупнее на 1%', 'aria-label':'Крупнее на 1%' }, '+');
  const show = () => { const v = blkScale(b); val.textContent = v + '%'; minus.disabled = v <= R.min; plus.disabled = v >= R.max; };
  const step = d => { b.scale = blkScale(b) + d; show(); change(); updateCounter(b); };
  minus.addEventListener('click', e => { e.preventDefault(); step(-1); });
  plus.addEventListener('click', e => { e.preventDefault(); step(1); });
  show();
  return h('div', { class:'step', title:'Размер текста' }, minus, val, plus);
}
function partStepper(b, p){
  const R = scaleRange('thesis'), cur = () => Math.min(R.max, Math.max(R.min, Math.round(+p.scale || 100)));
  const val = h('span'), minus = h('button', { type:'button', title:'Мельче на 1%', 'aria-label':'Мельче на 1%' }, '−'),
    plus = h('button', { type:'button', title:'Крупнее на 1%', 'aria-label':'Крупнее на 1%' }, '+');
  const show = () => { const v = cur(); val.textContent = v + '%'; minus.disabled = v <= R.min; plus.disabled = v >= R.max; };
  const step = d => { p.scale = cur() + d; show(); change(); updateCounter(b); };
  minus.addEventListener('click', e => { e.preventDefault(); step(-1); });
  plus.addEventListener('click', e => { e.preventDefault(); step(1); });
  show();
  return h('div', { class:'step', style:'margin:0', title:'Размер этого текста' }, minus, val, plus);
}
const isCaps = b => b.type === 'thesis' ? b.caps !== false : !!b.caps;
function capsSwitch(b){

function alignTools(b){

/* Название тезиса по умолчанию: первые слова текста (до 5), сколько целиком влезет в лимит длины.
   Пока название не правили руками, оно меняется вместе с текстом */
function autoName(html){
  const max = slidesCfg().names.maxLength;
  const words = plain(html || '').split('\n').map(l => l.replace(LIST_RE, '')).join(' ')
    .replace(BAD_CHARS, ' ').replace(/[«»"„“”]/g, '').split(/\s+/).filter(w => /[0-9A-Za-zА-Яа-яЁёІіЇїЄєҐґ]/.test(w));
  let out = '';
  const take = [];
  for (const w of words.slice(0, 5)){ if ((take.concat(w)).join(' ').length > max) break; take.push(w); }
  // не обрываем название на предлоге, союзе или частице: «…к Богу и» → «…к Богу»
  const weak = /^(.{1,2}|для|без|при|про|что|как|или|над|под|ибо|если|чем|это|тот|где|когда|чтобы)$/i;
  while (take.length > 1 && weak.test(take[take.length - 1].replace(/[^0-9A-Za-zА-Яа-яЁёІіЇїЄєҐґ]/g, ''))) take.pop();
  out = take.join(' ');
  out = out.replace(/[\s,.;:!?—–-]+$/, '');
  return cleanName(out ? out.charAt(0).toUpperCase() + out.slice(1) : '');
}
function syncAutoName(b){
  if (b.type !== 'thesis' || b.nameAuto === false) return;
  b.name = autoName(b.text);
  const inp = document.querySelector('.block[data-id="' + b.id + '"] .namebox input');
  if (inp && document.activeElement !== inp){ inp.value = b.name; inp.dispatchEvent(new Event('sync')); }
}

/* Название слайда: номер [N] стоит слева и не стирается; недопустимые для файлов символы не вводятся */
const NAME_PH = { thesis:'Сформируется само из первых слов текста', image:'Фото Десмонд Досс', video:'История Николаса Винтона', free:'Значения слова АГАПЕ' };
function nameField(b, n){

    cnt.classList.toggle('warn', len > cfg.maxLength);

/* ----- Списки в тезисе: строки, начинающиеся с «• » или «1. » -----
   Хранятся как обычный текст с переносами строк; на слайде такие строки становятся пунктами списка с висячим отступом */
const LIST_RE = /^(•|\d{1,2}[.)])[ \u00a0]/;
function richText(el){ return plain(cleanHTML(el)).replace(/\u00a0/g, ' '); }
function caretOffset(el){
  const s = getSelection(); if (!s.rangeCount || !el.contains(s.getRangeAt(0).startContainer)) return -1;
  const r = s.getRangeAt(0), pre = document.createRange(); pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  const tmp = document.createElement('div'); tmp.appendChild(pre.cloneContents());
  return plain(cleanHTML(tmp)).length;
}
/* Точка в DOM по номеру символа (перенос строки = 1 символ) */
function pointAt(el, off){
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT); let n, pos = 0;
  while ((n = w.nextNode())){
    if (n.nodeType === 3){ const L = n.nodeValue.replace(/\u00ad/g, '').length; if (off <= pos + L) return [n, off - pos]; pos += L; }
    else if (n.tagName === 'BR'){ if (off <= pos) return [n.parentNode, Array.prototype.indexOf.call(n.parentNode.childNodes, n)]; pos += 1; }
  }
  return [el, el.childNodes.length];
}
function selectText(el, a, b){
  const r = document.createRange(), p = pointAt(el, a), q = pointAt(el, b);
  r.setStart(p[0], p[1]); r.setEnd(q[0], q[1]);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function lineAt(el){
  const t = richText(el), c = caretOffset(el); if (c < 0) return null;
  const start = t.lastIndexOf('\n', c - 1) + 1, e = t.indexOf('\n', c), end = e < 0 ? t.length : e;
  const prevStart = start > 0 ? t.lastIndexOf('\n', start - 2) + 1 : -1;
  return { t, c, start, end, line:t.slice(start, end), prev:prevStart >= 0 ? t.slice(prevStart, start - 1) : '' };
}
function nextMarker(prevLine, kind){
  if (kind === '•') return '• ';
  const m = /^(\d{1,2})[.)][ \u00a0]/.exec(prevLine || '');
  return (m ? +m[1] + 1 : 1) + '. ';
}
/* Кнопки «•» и «1.»: включить или выключить список на строке с курсором */
function toggleList(kind){
  const el = activeRich(); if (!el || !el.dataset.lists) return;
  const L = lineAt(el); if (!L) return;
  const m = LIST_RE.exec(L.line), same = m && ((kind === '•') === (m[1] === '•'));
  if (m){ selectText(el, L.start, L.start + m[0].length); document.execCommand('delete'); }
  if (same) return;
  selectText(el, L.start, L.start);
  document.execCommand('insertText', false, nextMarker(L.prev, kind));
  const L2 = lineAt(el); if (L2) selectText(el, L2.end, L2.end);
}
/* Enter в списке продолжает его; Enter на пустом пункте — выход из списка */
function listEnter(el){
  const L = lineAt(el), m = L && LIST_RE.exec(L.line);
  if (m && !L.line.slice(m[0].length).trim() && L.c >= L.end){ selectText(el, L.start, L.end); document.execCommand('delete'); return; }
  document.execCommand('insertLineBreak');
  if (m) document.execCommand('insertText', false, m[1] === '•' ? '• ' : nextMarker(L.line, '1'));
}
/* «- » или «* » в начале строки становятся «• »; «1. » остаётся нумерацией, Enter ставит следующий номер */
function autoList(el){
  const L = lineAt(el); if (!L) return;
  const head = L.t.slice(L.start, L.c);
  if (/^[-*][ \u00a0]$/.test(head)){ selectText(el, L.start, L.c); document.execCommand('insertText', false, '• '); }
}

/* ----- Действия с блоками ----- */
function openSheet(at){ sheetAt = at; sheetOverlay.classList.add('open'); }
function closeSheet(){ sheetOverlay.classList.remove('open'); }
function addBlock(type, at){
  const nb = newBlock(type);
  state.blocks.splice(at, 0, nb);
  closeSheet(); change(); renderMain(); updateStatus();
  const card = document.querySelector('.block[data-id="' + nb.id + '"]');
  if (card){
    card.scrollIntoView({ block:'center', behavior:'smooth' });
    flash(nb.id);
    // тезис и цитата: курсор сразу в текст (название тезиса сформируется из него само)
    const f = (type === 'thesis' || type === 'quote') ? card.querySelector('.bbody .rich') : card.querySelector('.bbody input, .bbody textarea, .bbody .rich');
    if (f && window.matchMedia('(pointer:fine)').matches) f.focus({ preventScroll:true });
  }
}
function addItem(b, it){
  b.items.push(it);
  change(); rerender(b);
  const i = b.items.length - 1;
  if (it.kind === 'text') focusRich(b.id + ':' + i + ':t', 0);
  else if (it.kind === 'line') return;
  else { if (!it.manual) loadBible(it.lang); const card = document.querySelector('.block[data-id="' + b.id + '"]'); const items = card && card.querySelectorAll('.item'); if (items && items[i]) items[i].scrollIntoView({ block:'center', behavior:'smooth' }); }
}
function continueScripture(b){
  const scr = b.items.filter(it => it.kind === 'scripture'), lp = scr[scr.length - 1];
  const nb = newBlock('scripture');
  nb.showTr = b.showTr !== false;   // настройка «Показывать перевод» переходит на новый слайд
  if (lp.manual){
    const last = lp.verses[lp.verses.length - 1];
    const nx = nextNum(last.num);
    const it = Object.assign(newPart(), { mBook:lp.mBook || '', mChapter:lp.mChapter || '', mVerses:nx, translation:lp.translation, verses:[{ num:nx, text:'' }] });
    it.ref = manualRef(it);
    nb.items = [it];
  } else {
    const it = Object.assign(newScripture(lp.lang), { book:lp.book, chapter:lp.chapter, trName:lp.trName || '' });
    const cv = chapterVerses(it), next = lp.sel.length ? lp.sel[lp.sel.length - 1] + 1 : 0;
    if (cv && cv[next] != null) it.sel = [next];
    syncVerses(it);
    nb.items = [it];
  }
  state.blocks.splice(state.blocks.indexOf(b) + 1, 0, nb);
  change(); renderMain();
  const card = document.querySelector('.block[data-id="' + nb.id + '"]');
  if (card) card.scrollIntoView({ block:'start', behavior:'smooth' });
  flash(nb.id);
  toast('Новый слайд с тем же местом');
}
function move(b, dir){
  const i = state.blocks.indexOf(b), last = state.blocks.length - 1;
  const j = dir === -Infinity ? 0 : dir === Infinity ? last : i + dir;   // ±Infinity — в самый верх или низ
  if (j < 0 || j > last || j === i) return;
  state.blocks.splice(i, 1); state.blocks.splice(j, 0, b);
  change(); renderMain();
  const card = document.querySelector('.block[data-id="' + b.id + '"]');
  if (card) card.scrollIntoView({ block:'center', behavior:'smooth' });
  flash(b.id);
}
function duplicate(b){
  const c = JSON.parse(JSON.stringify(b)); c.id = uid(); c.done = false;
  state.blocks.splice(state.blocks.indexOf(b) + 1, 0, c);
  change(); renderMain(); flash(c.id); toast('Блок скопирован');
}
function removeBlock(b){
  const i = state.blocks.indexOf(b);
  state.blocks.splice(i, 1);

/* ----- Оформление текста ----- */
function activeRich(){ const a = document.activeElement; return a && a.classList && a.classList.contains('rich') ? a : null; }

/* Кнопки Ж, К, Ч подсвечиваются, если оформление уже есть: Ж + К вместе = жирный курсив */
function syncFmt(){
  if (!activeRich()) return;
  [['b', 'bold'], ['i', 'italic'], ['u', 'underline']].forEach(([c, cmd]) => {
    const btn = fmtEl.querySelector('.fbtn.' + c); if (!btn) return;
    let on = false; try { on = document.queryCommandState(cmd); } catch(e){}
    btn.classList.toggle('on', on);
  });
  const s = getSelection(), ub = fmtEl.querySelector('.up-btn');
  if (ub && s.rangeCount){ let a = s.getRangeAt(0).commonAncestorContainer; if (a.nodeType === 3) a = a.parentNode; ub.classList.toggle('on', !!(a.closest && a.closest('span.up'))); }
}

/* «Все прописные»: выделенный кусок показывается заглавными на слайде, в просмотре и PDF; повторное нажатие убирает */
function toggleUp(){
  const el = activeRich(); if (!el) return;
  const s = getSelection(); if (!s.rangeCount) return;
  const r = s.getRangeAt(0);
  let anc = r.commonAncestorContainer; if (anc.nodeType === 3) anc = anc.parentNode;
  const u = anc.closest ? anc.closest('span.up') : null;
  if (u && el.contains(u)){
    while (u.firstChild) u.parentNode.insertBefore(u.firstChild, u);
    u.remove();

    if (r.collapsed){ toast('Сначала выделите текст'); return; }
    const sp = document.createElement('span'); sp.className = 'up';
    sp.appendChild(r.extractContents());
    sp.querySelectorAll('span.up').forEach(x => { while (x.firstChild) x.parentNode.insertBefore(x.firstChild, x); x.remove(); });
    r.insertNode(sp);
    const nr = document.createRange(); nr.selectNodeContents(sp); s.removeAllRanges(); s.addRange(nr);

}

  const m = anc.closest ? anc.closest('mark') : null;
  if (m && el.contains(m)){

function clearFmt(){
  const el = activeRich(); if (!el) return;
  const s = getSelection();
  if (!s.rangeCount || s.isCollapsed){ toast('Выделите текст, с которого убрать оформление'); return; }
  const r = s.getRangeAt(0);
  if (!el.contains(r.commonAncestorContainer)) return;
  const tn = document.createTextNode(r.toString());
  r.deleteContents(); r.insertNode(tn);
  // выносим текст из всех оформляющих тегов: жирный, подчёркивание, маркер
  let p = tn.parentNode;
  while (p && p !== el && /^(B|STRONG|U|MARK|I|EM|SPAN|FONT)$/.test(p.tagName)){
    const right = p.cloneNode(false);
    while (tn.nextSibling) right.appendChild(tn.nextSibling);
    p.after(tn); tn.after(right);
    if (!right.textContent) right.remove();
    if (!p.textContent) p.remove();
    p = tn.parentNode;
  }
  el.querySelectorAll('b,strong,u,mark,i,em').forEach(x => { if (!x.textContent) x.remove(); });
  const nr = document.createRange(); nr.selectNodeContents(tn); s.removeAllRanges(); s.addRange(nr);

}

/* ========= Предпросмотр слайдов =========
   Кадр 1920×1080, раскладывается в полном размере и только масштабируется.
   Писание: место Писания стоит на фиксированной высоте; отступ от базовой линии нижней строки до низа фона
   не меньше, чем от верха букв места Писания до верха фона, иначе всё содержимое пропорционально уменьшается.
   Тезис и цитата: текст по центру своей области (тезис можно выровнять влево или вправо); если не помещается, уменьшается. */
const SL = { W:1920, min:16, trGap:48 };
let lastScale = 0;   // масштаб последнего предпросмотра в редакторе   // trGap — запас между текстом и подписью перевода
/* Базовые размеры (100%): Писание 48, тезис 50,4 (было 72, −30%), цитата 51,48 (было 57,2, −10%; имя автора — 52) */
const BASE = { scripture:48, thesis:50.4, quote:51.48 };   // Писание снова 48 (после проверки на проекторе); общий размер — в настройках слайдов
const scrPx = () => BASE.scripture * slidesCfg().sizes.scripture.size / 100;   // размер стихов с учётом общей настройки
const NBSP = '\u00a0';
const SHORT_RE = /(?<=^|[\s(«"„])([А-Яа-яЁёA-Za-zІіЇїЄєҐґ]{1,2}|[БбДдНнПпЧчКкИиОо](?:ез|ля|ад|од|ри|ро|то|ак|ли|бо|зо|ем)) (?=\S|$)/g;
function typoText(s){
  return String(s).replace(/[\t\r\n]+/g, ' ')
    .replace(/ {2,}/g, m => NBSP.repeat(m.length - 1) + ' ')   // несколько пробелов подряд остаются на слайде
    .replace(/(\d)\s*[-–]\s*(\d)/g, '$1–$2')
    .replace(/ - /g, ' — ').replace(/ —/g, NBSP + '—')
    .replace(SHORT_RE, '$1' + NBSP)
    .replace(/ (же|ли|ль|бы|б|ж)(?=[\s,.!?;:]|$)/gi, NBSP + '$1');
}
function typoDom(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), ns = []; let n;
  while ((n = w.nextNode())) ns.push(n);
  ns.forEach(t => { t.nodeValue = typoText(t.nodeValue); });

/* Греческие и еврейские слова (с диакритикой) оборачиваются в <span class="xl"> — шрифт Inter / Noto Sans Hebrew */
const XL_RE = /[\u0370-\u03FF\u1F00-\u1FFF\u0590-\u05FF\uFB1D-\uFB4F][\u0300-\u036F\u0370-\u03FF\u1F00-\u1FFF\u0590-\u05FF\uFB1D-\uFB4F]*/g;

  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), ns = []; let n;
  while ((n = w.nextNode())) if (!(n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('xl'))) { XL_RE.lastIndex = 0; if (XL_RE.test(n.nodeValue)) ns.push(n); }

    XL_RE.lastIndex = 0;

/* Если на последней строке одно слово — переносим перед последней группой слов предпоследней строки */
function fixOrphan(p){
  const sps = [], tw = document.createTreeWalker(p, NodeFilter.SHOW_TEXT); let n;
  while ((n = tw.nextNode())) for (let i = 0; i < n.nodeValue.length; i++) if (n.nodeValue[i] === ' ') sps.push({ n, i });

  const rectAt = (node, i) => { const r = document.createRange(); r.setStart(node, i); r.setEnd(node, i + 1); return r.getClientRects()[0]; };
  const topAfter = sp => {
    let node = sp.n, i = sp.i + 1;
    if (i >= node.nodeValue.length){
      const w = document.createTreeWalker(p, NodeFilter.SHOW_TEXT); w.currentNode = node; node = w.nextNode();
      while (node && !node.nodeValue.length) node = w.nextNode();

    }

  while (fn && !fn.nodeValue.trim()) fn = fw.nextNode();
  if (!fn) return;
  const f = rectAt(fn, 0); let lastTop = f ? f.top : -Infinity;
  const tol = (f ? f.height : 10) * 0.4;
  const starts = [];
  sps.forEach((sp, k) => { const t = topAfter(sp); if (t != null && t > lastTop + tol){ starts.push(k); lastTop = t; } });
  if (!starts.length) return;
  const ls = starts[starts.length - 1];
  if (ls !== sps.length - 1) return;
  const txt = p.textContent, tail = txt.slice(txt.lastIndexOf(' ') + 1);
  if (tail.split(/[\s\u00a0]+/).filter(Boolean).length > 1) return;
  const prev = starts.length > 1 ? starts[starts.length - 2] : -1, cand = ls - 1;
  if (cand <= prev) return;
  const sp = sps[cand], after = sp.n.splitText(sp.i);
  after.nodeValue = after.nodeValue.slice(1);
  sp.n.parentNode.insertBefore(document.createElement('br'), after);
}

const NOISE = (() => {

/* Убрать первые n букв текста из HTML (маркер списка), не трогая оформление */

  while (n > 0 && (node = w.nextNode())){ const k = Math.min(n, node.nodeValue.length); node.nodeValue = node.nodeValue.slice(k); n -= k; }

/* Строки текста → абзацы; с lists строки «• …» и «1. …» собираются в список */
function paraHTML(html, lists){

  const flush = () => { if (list){ out += '<div class="sl-list">' + list + '</div>'; list = ''; } };
  html.split('<br>').forEach(x => {
    const m = lists && LIST_RE.exec(plain(x).replace(/^\s+/, ''));
    if (m){
      const lead = plain(x).length - plain(x).replace(/^\s+/, '').length;
      const mk = m[1] === '•' ? '<span class="sl-mk"><span class="sl-dot"></span></span>' : '<span class="sl-mk num">' + esc(m[1].replace(')', '.')) + '</span>';
      list += '<p class="sl-tp sl-li">' + mk + '<span class="sl-lt">' + dropChars(x, lead + m[0].length) + '</span></p>';
    } else { flush(); out += '<p class="sl-tp">' + (x || '<br>') + '</p>'; }
