# Лимиты базы Crosspect (этап 10.5.4): раз в 3 часа читает счётчики Cloud Monitoring и кладёт итог в Firestore usage/current.
# Форма показывает их админу в окне «Лимиты базы» и подсвечивает кнопку списка пространств от 80 % (красным от 90 %).
# Нужен секрет FIREBASE_SERVICE_ACCOUNT, а у его аккаунта — роль «Monitoring Viewer» (Просмотр Monitoring).
# Объём данных берётся из метрики по умолчанию; исходящего трафика у Firestore среди метрик нет (список: Run workflow → «Показать метрики Monitoring»).
# Описание: cloud/private-repo/README.md и cloud/scripts/usage.mjs в публичном репозитории crosspect-app/crosspect.
name: Лимиты базы

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      list:
        description: 'Показать метрики Monitoring (без записи в базу)'
        type: boolean
        default: false

concurrency:
  group: usage
  cancel-in-progress: false

jobs:
  usage:
    name: Счётчики базы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crosspect-app/crosspect
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
        working-directory: cloud
      - name: Прочитать счётчики и записать usage/current
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIST: ${{ inputs.list }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Нет секрета FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/key.json"
          if [ "$LIST" = "true" ]; then
            GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json" node cloud/scripts/usage.mjs list
          else
            GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json" node cloud/scripts/usage.mjs
          fi
          rm -f "$RUNNER_TEMP/key.json"
