name: Тесты в Firefox и WebKit

# Этап 10.9.6: тесты формы в Firefox (все) и WebKit — движке Safari (основные пути: конспект, показ, JPEG, PowerPoint,
# картинки, телефон). Не мешают выпуску: после пуша в main, по кнопке и раз в неделю. Итоги — docs/arch/browsers.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Тесты (${{ matrix.engine }}, часть ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: firefox, shard: 1, of: 6, files: tests }
          - { engine: firefox, shard: 2, of: 6, files: tests }
          - { engine: firefox, shard: 3, of: 6, files: tests }
          - { engine: firefox, shard: 4, of: 6, files: tests }
          - { engine: firefox, shard: 5, of: 6, files: tests }
          - { engine: firefox, shard: 6, of: 6, files: tests }
          - { engine: webkit, shard: 1, of: 3, files: &wk tests/test_form.py tests/test_stage1051.py tests/test_stage1091.py tests/test_stage1096.py tests/test_stage93.py tests/test_phone.py }
          - { engine: webkit, shard: 2, of: 3, files: *wk }
          - { engine: webkit, shard: 3, of: 3, files: *wk }
    env:
      CROSSPECT_BROWSER: ${{ matrix.engine }}
      CROSSPECT_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python -m pytest ${{ matrix.files }} -q -p no:cacheprovider -rfE --tb=short --maxfail=80
