name: Тесты в Firefox и WebKit

# Этап 10.9.6: те же тесты формы в Firefox и WebKit (движок Safari). Не мешают выпуску:
# запускаются после пуша в main, по кнопке и раз в неделю.
on:
  push:
    branches: [main, browsers-1096]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox]
        shard: [1]
    name: Тесты (${{ matrix.engine }}, часть ${{ matrix.shard }})
    timeout-minutes: 45
    env:
      CROSSPECT_BROWSER: ${{ matrix.engine }}
      CROSSPECT_SHARD: ${{ matrix.shard }}/6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python -m pytest tests/test_zz_diag.py -s -p no:cacheprovider --tb=short
